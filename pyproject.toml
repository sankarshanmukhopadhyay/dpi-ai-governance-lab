[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dpi-ai-governance-lab"
version = "0.7.0"
description = "DPI AI Governance Lab Workbench: deterministic paper review scaffolding, extraction, validation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "CC-BY-4.0"}
license-files = ["LICENSE"]
authors = [{name = "DPI AI Governance Lab contributors"}]

dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.19",
  "pypdf>=4.0",
  "openai>=1.0",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
dpi-lab = "dpi_lab.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["dpi_lab*"]
exclude = [
  "artifacts*",
  "annexes*",
  "data*",
  "docs*",
  "papers*",
  "profiles*",
  "reviews*",
  "schemas*",
  "templates*",
  "tools*",
  "scripts*",
  "tests*",
]

[tool.setuptools.package-data]
"dpi_lab" = [
  "resources/**/*.json",
  "resources/**/*.yaml",
  "resources/**/*.yml",
  "resources/**/*.md",
  "resources/**/*.txt",
]
