name: CI
on:
  push:
  pull_request:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: CLI smoke test
        run: |
          dpi-lab --help
          dpi-lab review --help
          dpi-lab validate --help
          dpi-lab gaps-validate --help
          dpi-lab governance-validate --help
          dpi-lab governance-manifest --help

      - name: Offline smoke review + validate
        run: |
          mkdir -p /tmp/dpi-lab-ci
          python - <<'PY'
          from pypdf import PdfWriter
          writer = PdfWriter()
          writer.add_blank_page(width=612, height=792)
          with open('/tmp/dpi-lab-ci/smoke.pdf', 'wb') as handle:
              writer.write(handle)
          PY
          dpi-lab review --engine local --pdf /tmp/dpi-lab-ci/smoke.pdf --slug ci-smoke --out /tmp/dpi-lab-ci
          dpi-lab validate /tmp/dpi-lab-ci/ci-smoke

      - name: Validate bundled examples
        run: |
          dpi-lab validate reviews/examples-batch

      - name: Validate governance gap handoff
        run: |
          dpi-lab gaps-validate calibration/mission-loop/example-governance-gaps.yaml --summary

      - name: Validate executable governance case
        run: |
          CASE=case-studies/executable-governance-entitlement-agent
          dpi-lab governance-validate "$CASE"
          cp -R "$CASE" /tmp/executable-governance-case
          dpi-lab governance-manifest /tmp/executable-governance-case
          dpi-lab governance-validate /tmp/executable-governance-case --verify-manifest
