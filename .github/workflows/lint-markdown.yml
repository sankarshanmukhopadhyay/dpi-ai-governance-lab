name: Lint Markdown
on:
  push:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deps
        run: |
          pip install .
      - name: Lint maintained markdown surfaces
        run: |
          python tools/linters/lint_markdown.py README.md docs annexes methodology case-studies
