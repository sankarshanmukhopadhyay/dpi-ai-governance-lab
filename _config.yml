title: "DPI AI Governance Lab"
description: "TRACE workbench for evaluating DPI/AI publications, normalizing governance gaps, and verifying remediation."
theme: just-the-docs
url: "https://sankarshanmukhopadhyay.github.io"
baseurl: "/dpi-ai-governance-lab"
color_scheme: light
search_enabled: true
search:
  heading_level: 3
  previews: 3
  rel_url: true
  button: true
  focus_shortcut_key: k
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
aux_links:
  "Lab on GitHub":
    - "https://github.com/sankarshanmukhopadhyay/dpi-ai-governance-lab"
  "Remediation Artifacts":
    - "https://sankarshanmukhopadhyay.github.io/dpi-ai-governance-artifacts/"
aux_links_new_tab: true
nav_external_links:
  - title: "Companion Artifacts"
    url: "https://sankarshanmukhopadhyay.github.io/dpi-ai-governance-artifacts/"
    opens_in_new_tab: true
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Authority boundary
    color: yellow
mermaid:
  version: "11.4.1"
footer_content: "TRACE evaluates and recommends; jurisdictional, institutional, and deployment authorities retain decision authority."
exclude:
  - build/
  - dist/
  - "*.egg-info/"
  - ".github/"
  - "TRACE_COMPATIBILITY.json"
  - "TRACE_VERSION"
  - "reviews/_examples/"
  - "reviews/examples-batch/*/extracted/"
  - "reviews/examples-batch/*/run/"
  - vendor/
